<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-theme="light" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" data-theme="dark" />
    <meta name="description" content="Manage all your WordPress sites from your own Cloudflare account." />
    <link rel="icon" type="image/svg+xml" href="/kontrolwp.svg" />
    <title>KontrolWP</title>
    <script>
      // Apply the saved theme before the first paint (see src/web/theme.ts).
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("kontrolwp.theme");
        } catch (error) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
